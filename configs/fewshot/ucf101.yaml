_base_: ../default.yaml
task: fewshot
dataset: ucf101
shot: 2                 # labeled videos per class (2, 4, 8, 16)
work_dir: work_dirs/fewshot/ucf101_k{shot}

data:
  video_root: data/ucf101/videos
  skeleton_file: data/ucf101/skeletons.pkl
  train:
    ann_file: splits/ucf101/fewshot/train_k{shot}.txt
    label_file: labels/ucf101.json
  test:
    ucf101:
      splits: [{ann_file: splits/ucf101/val1.txt, label_file: labels/ucf101.json}]

skeleton:
  num_class: 51
  checkpoint: checkpoints/skeleton/ucf101_base/best.pth

optim:
  epochs: 50
  warmup_epochs: 5
  lr: 2.0e-6
