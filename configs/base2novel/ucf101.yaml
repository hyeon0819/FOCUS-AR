_base_: ../default.yaml
task: base2novel
dataset: ucf101
split: 1                # base-class training split (1, 2, 3)
work_dir: work_dirs/base2novel/ucf101_split{split}

data:
  video_root: data/ucf101/videos
  skeleton_file: data/ucf101/skeletons.pkl
  train:
    ann_file: splits/ucf101/base2novel/train_s{split}.txt
    label_file: labels/ucf101_base.json
  test:
    base:
      splits: [{ann_file: splits/ucf101/base2novel/val_base.txt, label_file: labels/ucf101_base.json}]
    novel:
      splits: [{ann_file: splits/ucf101/base2novel/val_novel.txt, label_file: labels/ucf101_novel.json}]

skeleton:
  num_class: 51
  checkpoint: checkpoints/skeleton/ucf101_base/best.pth

optim:
  epochs: 20
  warmup_epochs: 3
